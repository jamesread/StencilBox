# Marketing screenshots, captured by `make` in this directory against the
# throwaway stack it starts (see Makefile / seed/).
#
# title/description/theme are not used by repo-helper; `make manifest` turns
# them into screenshot-manifest.yaml for indexers. Every section needs them.

[DEFAULT]
base_url = http://127.0.0.1:18480/
dir = .
width = 1280
height = 800
script = scripts/light.py, scripts/prepare.py
post_script_sleep = 1.5
theme = light
manifest_project = StencilBox
manifest_base_url = https://raw.githubusercontent.com/jamesread/StencilBox/main/var/marketing/screenshots/

[build-configs]
url = webui/build-configs
height = 400
title = Build configurations
description = The admin UI lists every build config, with its template and status, so you can open one and rebuild a site from the browser.

[homepage]
url = homepage/
script = scripts/prepare_site.py
title = Links homepage
description = A links homepage built from YAML data with the links-homepage template, organised into categories for quick navigation.

[iframe-sidebar]
url = sidebar/
script = scripts/prepare_sidebar.py
title = Iframe sidebar
description = An iframe sidebar built from YAML, so a strip of app icons can open each destination in place without leaving the page.

[status-page]
url = status/
script = scripts/prepare_site.py
height = 600
title = Status page
description = A status page generated from YAML service entries, so uptime can be published as a static site.
