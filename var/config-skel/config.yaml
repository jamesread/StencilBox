configVersion: 1

# The web UI and API need a login; built sites in the output directory stay public.
# Users, groups and roles live in stencilbox.db next to this file. On first start,
# StencilBox creates the user "admin" with password "admin" - change it after logging in.
#
# This block configures single sign-on (JWT, trusted proxy headers, mTLS) using the
# httpauthshim format: https://github.com/jamesread/httpauthshim
# See https://jamesread.github.io/StencilBox/config/authentication.html
auth: {}

# Users, groups, roles and API keys need the database (stencilbox.db). Set enabled: false to
# run without one: then only requests made directly from localhost are accepted.
# database:
#   enabled: false
